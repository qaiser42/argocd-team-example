# Plaintext for readability ONLY. Real repo: SealedSecret / ExternalSecret, or one-off `argocd repo add`.
# OCI Helm registry (Harbor, GHCR, ECR, Forgejo packages, ...).
# Notes:
#   * type stays `helm`; `enableOCI: "true"` switches to OCI protocol.
#   * url WITHOUT `oci://` prefix. Applications reference it the same way.
#   * Works on every Argo CD version that supports Helm 3 OCI (>= 2.3).
apiVersion: v1
kind: Secret
metadata:
  name: repo-payments-charts-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: payments-charts
  url: registry.example.com/payments/charts
  enableOCI: "true"
  username: argocd-bot
  password: <registry-token>
