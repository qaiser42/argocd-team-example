# Plaintext for readability ONLY. Real repo: SealedSecret / ExternalSecret, or one-off `argocd repo add`.
# Generic OCI artifact source (plain manifests / kustomize dirs / helm charts
# pushed with `oras push`). Argo CD >= 3.1, verify against your version.
#   * type `oci`, url WITH `oci://` prefix.
#   * secret-type `repo-creds` = credential template matched by URL PREFIX, so one
#     secret covers oci://registry.example.com/payments/gitops AND .../charts/*.
#     (`repository` secret-type would need the exact repoURL per Application.)
apiVersion: v1
kind: Secret
metadata:
  name: creds-payments-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
stringData:
  type: oci
  url: oci://registry.example.com/payments
  username: argocd-bot
  password: <registry-token>
  # insecureOCIForceHttp: "true"   # only for a plain-HTTP lab registry
