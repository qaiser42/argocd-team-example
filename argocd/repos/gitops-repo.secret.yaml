# Plaintext for readability ONLY. Real repo: SealedSecret / ExternalSecret, or one-off `argocd repo add`.
# Git repo credential (HTTPS token). Label is what makes Argo CD pick it up.
apiVersion: v1
kind: Secret
metadata:
  name: repo-payments-gitops
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  name: payments-gitops
  url: https://git.example.com/payments/gitops.git
  username: argocd-bot
  password: <forgejo-personal-access-token>
