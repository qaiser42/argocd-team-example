apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-worker
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-worker
          image: registry.example.com/payments/ledger-worker
          envFrom:
            - configMapRef:
                name: ledger-worker-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
